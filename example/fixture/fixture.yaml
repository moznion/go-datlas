# Fixture policies of types that cannot be annotated, such as types generated by other tools.
types:
  - type: github.com/moznion/go-datlas/example/dbgen.InsertAccountParams
    name: Account
    fields:
      ID: uuid
      Email: email
      DisplayName: name,wrap=nullString
      Plan: oneof=free|pro,wrap=null
      CreatedAt: now
      DeletedAt: "-"
  - type: github.com/moznion/go-datlas/example/dbgen.InsertMembershipParams
    name: Membership
    fields:
      ID: uuid
      AccountID: uuid,ref=Account.ID # also generates MembershipAccountIDFrom(account)
      Role: oneof=owner|member
