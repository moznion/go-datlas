name: tagpr

# Keeps a release pull request open for the unreleased changes on main. Merging
# it makes tagpr tag the merge commit and create a *draft* GitHub Release; the
# `build` job (release-build.yml) cross-builds the `datlas` binary for every
# target and attests its provenance, then the `release` job attaches the
# archives to the draft and publishes it. Attaching before publishing keeps
# this working with immutable releases, which forbid changing assets after.
#
# The tag is pushed with GITHUB_TOKEN, which does not trigger `on: push: tags`
# workflows, so the assets are built in this workflow directly.
# Run it manually with a tag to finish a release left as a draft (e.g. a failed
# build); the tagpr job is skipped in that case.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.2.3)
        required: true
        type: string

concurrency:
  group: tagpr
  cancel-in-progress: false

permissions: {}

jobs:
  tagpr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: tagpr
    # Runs after tagpr cut a tag, or on a manual dispatch (tagpr skipped).
    if: >-
      !cancelled() && !failure()
      && (needs.tagpr.outputs.tag != '' || github.event_name == 'workflow_dispatch')
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.tagpr.outputs.tag || inputs.tag }}

  release:
    needs: [tagpr, build]
    if: >-
      !cancelled() && !failure()
      && (needs.tagpr.outputs.tag != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: datlas-dist
          path: dist

      # Attach the assets to tagpr's draft and only then publish it, since an
      # immutable release rejects asset changes once published.
      - name: Upload assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tagpr.outputs.tag || inputs.tag }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "::notice::release $TAG is already published; leaving its assets as is"
            exit 0
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
