name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting and go.mod
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          for m in . example; do (cd $m && go mod tidy -diff); done
      - run: go vet ./...
      - run: go test -race ./...
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2026.2.2"
          install-go: false

  example:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: datlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATLAS_TEST_POSTGRES_DSN: postgres://postgres:datlas@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: example/go.mod
      - name: Check that generated code is up to date
        run: |
          (cd fixture && go tool datlas fixture -config fixture.yaml -check ../model)
          (cd masterdata && go tool datlas master -check)
          (cd seeddata && go tool datlas seed -check)
          (cd dbapply/edgecases && go tool datlas master -dir master -check && go tool datlas seed -dir seed -check)
      - run: go vet ./...
      - run: go test -race ./...
